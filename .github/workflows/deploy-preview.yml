name: Deploy WeChat Preview

on:
  push:
    branches: [feature/family-finance-projects]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wechat-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Validate repository secrets
        env:
          WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$WECHAT_PRIVATE_KEY" ]] || missing+=("WECHAT_PRIVATE_KEY")

          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required repository secret(s): %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save miniprogram-ci@2.1.31

      - name: Run tests
        run: npm test -- --runInBand

      - name: Prepare WeChat upload
        id: preview
        env:
          WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$WECHAT_PRIVATE_KEY" > "$RUNNER_TEMP/wechat-upload.key"
          preview_version="$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}"
          preview_desc="${GITHUB_SHA::7} $(git log -1 --pretty=%s)"
          preview_desc="${preview_desc:0:45}"
          printf 'version=%s\n' "$preview_version" >> "$GITHUB_OUTPUT"
          printf 'desc=%s\n' "$preview_desc" >> "$GITHUB_OUTPUT"

      - name: Detect changed cloud functions
        id: functions
        env:
          BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          npm run ci:detect-functions -- \
            --before "$BEFORE_SHA" \
            --after "$GITHUB_SHA"

      - name: Deploy changed cloud functions
        id: deploy_functions
        if: github.event_name == 'push' && steps.functions.outputs.changed != '[]'
        env:
          CHANGED_FUNCTIONS: ${{ steps.functions.outputs.changed }}
          WECHAT_PRIVATE_KEY_PATH: ${{ runner.temp }}/wechat-upload.key
        run: |
          set -euo pipefail
          node -e '
            let functions
            try {
              functions = JSON.parse(process.env.CHANGED_FUNCTIONS)
            } catch (_error) {
              throw new Error("CHANGED_FUNCTIONS must be a JSON array")
            }
            if (!Array.isArray(functions) || functions.some(name => (
              typeof name !== "string" || !/^[A-Za-z0-9_-]+$/.test(name)
            ))) {
              throw new Error("CHANGED_FUNCTIONS must be a JSON array")
            }
          '

          mapfile -t changed_functions < <(node -e '
            for (const functionName of JSON.parse(process.env.CHANGED_FUNCTIONS)) {
              console.log(functionName)
            }
          ')
          : > "$RUNNER_TEMP/deployed-functions.txt"
          for function_name in "${changed_functions[@]}"; do
            npx miniprogram-ci cloud functions upload \
              --pp ./ \
              --appid wxcabf6afa48b9277d \
              --pkp "$WECHAT_PRIVATE_KEY_PATH" \
              --env cloudbase-d7gx0ikiwa58549a4 \
              --name "$function_name" \
              --path "./cloudfunctions/$function_name" \
              --remote-npm-install true
            printf '%s\n' "$function_name" >> "$RUNNER_TEMP/deployed-functions.txt"
          done

      - name: Upload WeChat preview
        id: upload
        env:
          WECHAT_PRIVATE_KEY_PATH: ${{ runner.temp }}/wechat-upload.key
          PREVIEW_VERSION: ${{ steps.preview.outputs.version }}
          PREVIEW_DESC: ${{ steps.preview.outputs.desc }}
        run: npm run ci:upload-preview

      - name: Generate WeChat preview QR
        id: generate_qr
        env:
          WECHAT_PRIVATE_KEY_PATH: ${{ runner.temp }}/wechat-upload.key
          PREVIEW_DESC: ${{ steps.preview.outputs.desc }}
          PREVIEW_QR_PATH: ${{ runner.temp }}/wechat-preview-qrcode.png
        run: npm run ci:generate-preview-qr

      - name: Upload WeChat preview QR artifact
        id: upload_qr
        uses: actions/upload-artifact@v4
        with:
          name: wechat-preview-qrcode
          path: ${{ runner.temp }}/wechat-preview-qrcode.png
          if-no-files-found: error
          retention-days: 7

      - name: Clean up WeChat upload key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/wechat-upload.key"

      - name: Write deployment summary
        if: always()
        env:
          CHANGED_FUNCTIONS: ${{ steps.functions.outputs.changed || '[]' }}
          DELETED_FUNCTIONS: ${{ steps.functions.outputs.deleted || '[]' }}
          DETECTION_OUTCOME: ${{ steps.functions.outcome || 'skipped' }}
          DEPLOY_OUTCOME: ${{ steps.deploy_functions.outcome || 'skipped' }}
          PREVIEW_VERSION: ${{ steps.preview.outputs.version || 'not uploaded' }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome || 'skipped' }}
          QR_GENERATION_OUTCOME: ${{ steps.generate_qr.outcome || 'skipped' }}
          QR_ARTIFACT_UPLOAD_OUTCOME: ${{ steps.upload_qr.outcome || 'skipped' }}
        run: |
          set -euo pipefail
          {
            printf '## WeChat preview deployment\n\n'
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Development version upload: `%s` (`%s`)\n' "$PREVIEW_VERSION" "$UPLOAD_OUTCOME"
            printf -- '- Preview QR: available as the `wechat-preview-qrcode` artifact only when QR generation and artifact upload both succeeded (generation: `%s`; artifact upload: `%s`).\n\n' "$QR_GENERATION_OUTCOME" "$QR_ARTIFACT_UPLOAD_OUTCOME"
            printf '### Cloud functions deployed\n\n'

            if [[ "$DETECTION_OUTCOME" != "success" ]]; then
              printf 'Detection did not complete; no deployment was attempted.\n'
            elif [[ -s "$RUNNER_TEMP/deployed-functions.txt" ]]; then
              while IFS= read -r function_name; do
                printf -- '- `%s`\n' "$function_name"
              done < "$RUNNER_TEMP/deployed-functions.txt"
              if [[ "$DEPLOY_OUTCOME" != "success" ]]; then
                printf '\nDeployment stopped after the functions listed above; review the failed step.\n'
              fi
            elif [[ "$CHANGED_FUNCTIONS" == "[]" ]]; then
              printf 'None; no registered cloud functions changed.\n'
            elif [[ "$DEPLOY_OUTCOME" == "skipped" ]]; then
              printf 'None; automatic function deployment was skipped for this event.\n'
            else
              printf 'None completed. Review the failed deployment step.\n'
            fi

            printf '\n### Deletion warning\n\n'
            if [[ "$DETECTION_OUTCOME" != "success" ]]; then
              printf 'Deletion detection did not complete.\n'
            elif [[ "$DELETED_FUNCTIONS" == "[]" ]]; then
              printf 'No registered cloud function deletions detected.\n'
            else
              printf 'The following functions had deleted files and were not deleted from CloudBase: `%s`.\n' \
                "$DELETED_FUNCTIONS"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
